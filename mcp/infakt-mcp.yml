notes: inFakt publishes a hosted MCP (Model Context Protocol) server, presented in partnership with Anthropic
  (Claude), that lets AI agents operate a company's invoicing and accounting through the inFakt API v3.
  The MCP surface mirrors the REST API resources (invoices, clients, products, costs, bank accounts).
  The exact tool list and remote endpoint URL are provisioned per account from the in-app MCP settings
  and are not published as a static manifest; tools below are the derived REST-resource mapping, not a
  verbatim tool catalog.
